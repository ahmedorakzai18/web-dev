<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
</head>
<body>

<div style="background-color: #ffffff; padding: 30px 40px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px;">

<h2 style="text-align: center; color: #333333;">Login</h2>

<form action="/login" method="POST">
  <label for="username" style="display: block; margin-bottom: 5px; color: #555555;">Username</label>
  <input type="text" id="username" name="username" placeholder="Enter your username" required style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #cccccc; border-radius: 4px; box-sizing: border-box;">

  <label for="password" style="display: block; margin-bottom: 5px; color: #555555;">Password</label>
  <input type="password" id="password" name="password" placeholder="Enter your password" required style="width: 100%; padding: 8px; margin-bottom: 20px; border: 1px solid #cccccc; border-radius: 4px; box-sizing: border-box;">

  <button type="submit" style="width: 100%; padding: 10px; background-color: #007bff; color: #ffffff; border: none; border-radius: 4px; cursor: pointer;">Login</button>
</form>

</div>

</body>
</html>
