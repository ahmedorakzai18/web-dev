    <h1>Selecting Elements by Tag name</h1>
    <p>means targeting HTML elements based on their container type</p>
    <p>Syntax is: const paragraphs = document.getElementsByTagName("p");</p>
    <ul>
      Examples:
      <li>h1</li>
      <li>p</li>
      <li>div</li>
      <li>li</li>
    </ul>
