    <title>Add Event Listener</title>
</head>
<body>
    
    <h1>Add Event Listener</h1>
    <h3>General Syntax</h3>
    <pre>
        element.addEventListener("event", function() {
        // code to run
        });
    </pre>

    <h3>Example</h3>
    <pre>
        button.addEventListener("click", function() {
        console.log("Hello!");
        });
    </pre>
