<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Events</title>
</head>
<body>
    
    <h1>Dom Events</h1>
    <p>An event is something that happens in or around a webpage.
        <br><br>
        Example:
        <ul>
            <li>User clicks a button</li>
            <li>User moves the mouse</li>
            <li>User presses a keyboard key</li>
            <li>User submits a form</li>
            <li>A webpage finishes loading</li>
            <li>User moves the mouse over an element</li>
        </ul>
    </p>

    <button id="c1" style="background-color:pink;">Click(APPLY)</button>
    <button id="c3" style="background-color:#00113a; color:#f8f2bf;">Click(APPLY)</button>
    <button id="c2">Dbl.Click(ERASE)</button>

    <script src="01dom-events.js"></script>
</body>
</html>
