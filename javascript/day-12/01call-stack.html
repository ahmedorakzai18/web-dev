    <h1>Call Stack</h1>
    <p>The Call Stack is a mechanism JavaScript uses to keep track of which function is currently running and which function should run next.</p>

    <div>
    <strong>It operates on the Last-In, First-Out (LIFO)</strong>
    <br>
    <i>Imagine a stack of plates, the top one comes last but goes out first</i>
