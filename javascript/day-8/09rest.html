<body>
    <h1>Rest Concept</h1>

    <p>The rest operator allows you to collect multiple values into a single array.</p>

    <strong>Remeber: Rest Collects values:</strong>
    <pre>
        function add(...numbers)
        {
            console.log(numbers);
        }

        add(10, 20, 30);
    </pre>
