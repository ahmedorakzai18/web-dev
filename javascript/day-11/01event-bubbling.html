<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bubbling</title>
    <link rel="stylesheet" href="01event-bubbling.css">
</head>
<body>
    
    <h1>Event Bubbling Concept</h1>
    <p>An event that happens on a child element can also reach its parent elements.</p>

    <hr>

    <div id="parent">
        <button id="child">Submit</button>
    </div>

    <hr>

    <div id="lists">
        <ul>
            <li>Number: 1</li>
            <li>Number: 2</li>
            <li>Number: 3</li>
        </ul>
    </div>

    <script src="01event-bubbling.js"></script>
</body>
</html>
