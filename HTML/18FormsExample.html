<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example Form</title>
</head>
<body>
    
    <form action="/action_page.php">
        <label>Name:</label>
        <input type="text" placeholder="Enter Name">
        <br>
        <br>
        <br>

        <label>Email:</label>
        <input type="email" placeholder="Enter Email">
        <br>
        <br>
        <br>

        <label>Password:</label>
        <input type="password" placeholder="Enter Password">
        <br>
        <br>
        <br>

        <label>Enter Gender</label>
        <br>
        <input type="radio" name="gender" id="male"><label for="male">Male</label>
        <br>
        <input type="radio" name="gender" id="female"><label for="female">Female</label>
        <br>
        <input type="radio" name="gender" id="other"><label for="Other">Other</label>
        <br><br>


        <label>Hobbies</label>
        <br>
        <input type="checkbox" id="coding">
        <label for="coding">Coding</label>
        
        <br>

        <input type="checkbox" id="Watch Movies">
        <label for="Watch Movies">Watching Movies</label>

        <br>

        <input type="checkbox" id="reading">
        <label for="reading">Reading</label>

        <br>
        <br>
        <br>


        <label for="country">Country</label> <br>
        <select id="country">
            <option>Pakistan</option>
            <option>China</option>
            <option>India</option>
            <option>Iran</option>
            <option>Afghanistan</option>
        </select>
        <br>
        <br>
        <br>

        <button type="submit">Submit Form</button>
    </form> 

</body>
</html>
