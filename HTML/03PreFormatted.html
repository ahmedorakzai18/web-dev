<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre Formated Element</title>
</head>
<body>
    <h1>
        Pre-Formated Element
    </h1>

    <pre>
        This paragraph does whatever way I write it in.
        if i broke a line, or added     lots of space, 
        it will display like that.
    </pre>

    <p>
        A simple paragraph Ignores all that spaces and lines you have 
        made inside the p tag.
    </p>
    <hr> 
    <!-- the hr made a whole horizental line -->
    
</body>
</html>
